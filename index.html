<script>
const QUESTIONS=[
["What is generally meant by waste?",["All natural substances","Unwanted or discarded materials after use","Only solid materials","Only industrial materials"],1],
["Which of the following is a biodegradable waste?",["Glass","Plastic","Vegetable peels","Aluminium"],2],
["Which of the following is a non-biodegradable waste?",["Fruit peels","Dry leaves","Paper","Glass"],3],
["Which of the following is NOT included in the 3R principle?",["Reduce","Reuse","Recycle","Remove"],3],
["What does Reduce mean?",["Reuse","Reducing the quantity of waste","Burning waste","Burying waste in the soil"],1],
["Reuse means—",["Using the same item again","Destroying waste","Separating waste","Burning waste"],0],
["What is meant by Recycle?",["Dumping waste into rivers","Processing waste again to produce usable materials","Burying waste","Burning waste"],1],
["Vegetable peels from the kitchen are what type of waste?",["Organic waste","E-waste","Radioactive waste","Metallic waste"],0],
["What is the full form of E-waste?",["Environmental Waste","Electronic Waste","Energy Waste","Ecological Waste"],1],
["Which of the following is an example of e-waste?",["Old mobile phone","Vegetable peels","Sawdust","Dry leaves"],0],
["What is the primary function of a Scrubber?",["To convert solid waste into manure","To remove pollutants from gaseous emissions","To melt plastic","To decompose organic waste"],1],
["Electrostatic Precipitator (ESP) is mainly effective in controlling which pollutant?",["Noise","Fine particulate matter in air","Aquatic microorganisms","Organic waste"],1],
["What is the major similarity between a Bag Filter and an ESP?",["Both treat water","Both are used to remove particulate pollutants from gas streams","Both produce compost","Both burn waste"],1],
["Cyclone Separator mainly works on which principle?",["Separation by gravity and rotational motion","Organic decomposition","Electrolysis","Photochemical reaction"],0],
["One major advantage of Incineration is—",["Significant reduction in the volume of waste","Complete elimination of all types of pollution","No residue is produced","No energy is required"],0],
["What is the most important environmental precaution in Incineration?",["Controlling the gaseous emissions produced","Determining only the colour of the waste","Increasing the weight of the waste","Conserving rainwater"],0],
["A characteristic feature of Pyrolysis is—",["Combustion in the presence of abundant oxygen","Thermal decomposition in the absence or very limited presence of oxygen","Decomposition of waste only in an aqueous environment","Breaking down waste only with the help of sunlight"],1],
["What can generally be produced during Gasification?",["Syngas","Only oxygen","Only water","Only nitrogen"],0],
["In Anaerobic Digestion—",["Oxygen is essential","Microorganisms break down organic matter in the absence of oxygen","Only inorganic waste is used","No gas is produced"],1],
["Which gas is mainly present in the biogas produced from Anaerobic Digestion?",["Oxygen","Methane","Ozone","Nitrogen dioxide"],1],
["Which plays the primary role in Vermicomposting?",["No organism other than bacteria","Earthworms","Fish","Only fungi"],1],
["Which of the following is an example of Waste-to-Energy?",["Generating electricity from waste","Dumping waste into rivers","Burning waste in the open","Burying waste in the soil"],0],
["What is meant by Refuse-Derived Fuel (RDF)?",["Drinking water produced from waste","Fuel produced by processing combustible waste","Organic manure produced from waste","Oxygen produced from waste"],1],
["Which of the following is NOT included in the ‘3R’ of waste management?",["Reduce","Reuse","Recycle","Recover"],3],
["What is the objective of ‘Repair’ in the 8R principle?",["To quickly discard usable items","To repair damaged items and extend their useful life","To burn all waste","To send waste to a landfill"],1],
["What is the main idea behind the ‘Rethink’ principle?",["Buying more products","Thinking about alternative uses before discarding an item","Burning all waste","Only recycling waste"],1],
["Which of the following is most closely associated with Extended Producer Responsibility (EPR)?",["Consumers have no responsibility","Producers are responsible for managing waste after the use of their products","Only municipalities are responsible","Only waste collectors are responsible"],1],
["What is the primary function of a Material Recovery Facility (MRF)?",["Sorting and recovering reusable materials from waste","Only burning waste","Only burying waste","Only treating liquid waste"],0],
["Which of the following pairs is correct?",["Scrubber — Solid waste composting","ESP — Removal of particulate pollutants","Composting — Melting metals","Landfill — Gas purification"],1],
["Which of the following is most closely associated with ‘Waste Minimization’?",["Planning to reduce waste from the very beginning of production","Increasing the amount of waste generated","Dumping all waste in one place","Burning waste in the open"],0],
["Consider the following statements:\n1. Organic waste can be converted into compost.\n2. All types of plastic are easily biodegradable.\n3. Source Segregation makes recycling easier.\nWhich of the following is correct?",["1 and 2","1 and 3","2 and 3","1, 2 and 3"],1],
["Consider the following statements:\n1. The objective of the Reduce principle is to decrease waste generation.\n2. Reuse involves using an item again.\n3. In Recycling, waste may be converted into new materials or products.",["Only 1","1 and 2","2 and 3","1, 2 and 3"],3],
["Which of the following are air pollution control technologies?\n1. Scrubber\n2. ESP\n3. Bag Filter\n4. Composting",["1 and 2","1, 2 and 3","2, 3 and 4","1, 2, 3 and 4"],1],
["Which of the following are associated with organic waste management?\n1. Composting\n2. Vermicomposting\n3. Anaerobic Digestion\n4. Biomethanation",["1 and 2","2 and 3","1, 2 and 3","1, 2, 3 and 4"],3],
["Which of the following statements is correct?",["Leachate is generally clean drinking water","Leachate can be generated from a landfill","Leachate is generated only in industries","Leachate has no relation to groundwater pollution"],1],
["Match List-I with List-II:\nList-I\na. Scrubber\nb. Composting\nc. ESP\nd. Anaerobic Digestion\nList-II\n1. Biogas production\n2. Removal of particulate pollutants\n3. Control of gaseous pollutants\n4. Production of organic manure",["a-3, b-4, c-2, d-1","a-2, b-3, c-4, d-1","a-4, b-1, c-2, d-3","a-1, b-4, c-3, d-2"],0],
["Select the correctly matched pairings:\na. Pyrolysis — 1. Thermal decomposition in limited/absent oxygen\nb. Gasification — 2. Production of fuel gas\nc. Landfill — 3. Designated site for waste disposal\nd. RDF — 4. Waste-derived fuel",["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-3, b-2, c-1, d-4","a-4, b-3, c-2, d-1"],0],
